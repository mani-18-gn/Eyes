version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: realitylens-postgres
    environment:
      POSTGRES_USER: realitylens_user
      POSTGRES_PASSWORD: realitylens_secure_password_2026
      POSTGRES_DB: realitylens_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U realitylens_user -d realitylens_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: realitylens-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ../
      dockerfile: infrastructure/docker/Dockerfile.backend
    container_name: realitylens-backend
    environment:
      DATABASE_URL: postgresql+asyncpg://realitylens_user:realitylens_secure_password_2026@postgres:5432/realitylens_db
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-realitylens-super-secure-production-master-secret-key-3849102}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - uploads_data:/app/uploads

  web:
    build:
      context: ../web
      dockerfile: ../infrastructure/docker/Dockerfile.web
    container_name: realitylens-web
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  uploads_data:
