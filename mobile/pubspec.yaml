name: realitylens
description: "RealityLens Mobile - See it. Get it. Do it. Your camera just got a brain."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.10.5+9
  flutter_riverpod: ^2.5.1
  http: ^1.2.1
  shared_preferences: ^2.2.3
  intl: ^0.19.0
  permission_handler: ^11.3.1
  path_provider: ^2.1.3
  path: ^1.9.0
  uuid: ^4.4.0
  flutter_secure_storage: ^9.0.0
  google_fonts: ^6.2.1
  flutter_spinkit: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
